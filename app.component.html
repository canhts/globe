<div class="fixed inset-0 w-full h-full cursor-grab active:cursor-grabbing overflow-hidden bg-black touch-none font-sans">
  <!-- Main Canvas -->
  <canvas #rendererCanvas class="absolute inset-0 w-full h-full"></canvas>

  <!-- Camera Preview (Compact & Cinematic Transitions) -->
  <div class="absolute top-6 right-6 w-32 sm:w-44 aspect-video bg-white/5 backdrop-blur-xl border border-white/20 rounded-2xl overflow-hidden shadow-2xl transition-all duration-500 pointer-events-none"
       [class.opacity-0]="!isCameraActive()"
       [class.scale-90]="!isCameraActive()"
       [class.opacity-100]="isCameraActive() && !isShuttingDown()"
       [class.scale-100]="isCameraActive() && !isShuttingDown()"
       [class.grayscale]="isShuttingDown()"
       [class.blur-sm]="isShuttingDown()">
    
    <video #videoElement class="w-full h-full object-cover scale-x-[-1] opacity-80" autoplay playsinline></video>
    
    <!-- Glitch overlay when shutting down -->
    @if (isShuttingDown()) {
      <div class="absolute inset-0 bg-red-500/10 mix-blend-overlay animate-pulse"></div>
      <div class="absolute inset-0 flex items-center justify-center bg-black/40">
        <span class="text-[8px] text-white/60 font-mono tracking-widest uppercase">Off-line</span>
      </div>
    }

    @if (activeFingers() >= 4 && !isShuttingDown()) {
      <div class="absolute inset-0 border-2 border-cyan-400/50 animate-pulse rounded-2xl"></div>
      <div class="absolute top-2 right-2 w-2 h-2 bg-cyan-400 rounded-full shadow-[0_0_10px_#22d3ee]"></div>
    }
  </div>

  <!-- Status Indicator (Floating) -->
  @if (isCameraActive()) {
    <div class="absolute top-8 left-1/2 -translate-x-1/2 px-6 py-2 rounded-full backdrop-blur-2xl bg-black/40 border border-white/10 flex items-center gap-3 transition-all duration-300"
         [class.border-red-500/30]="isShuttingDown()">
      <div class="w-2 h-2 rounded-full transition-colors duration-300" 
           [class]="isShuttingDown() ? 'bg-red-500 animate-ping' : (isHandDetected() ? 'bg-cyan-400 shadow-[0_0_8px_#22d3ee]' : 'bg-white/20')"></div>
      <span class="text-[10px] font-bold tracking-[0.2em] uppercase text-white/80 whitespace-nowrap">
        {{ controlStatus() }}
      </span>
    </div>
  }

  <!-- Bottom Control Bar -->
  <div class="absolute bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center gap-6">
    
    <button (click)="toggleHandControl()"
            [disabled]="isLoadingCamera() || isShuttingDown()"
            class="group relative w-16 h-16 rounded-full flex items-center justify-center transition-all duration-300 active:scale-90 overflow-hidden"
            [class]="isCameraActive() ? (isShuttingDown() ? 'bg-red-900/50 grayscale shadow-none' : 'bg-cyan-500 shadow-[0_0_40px_rgba(34,211,238,0.3)]') : 'bg-white/10 backdrop-blur-md border border-white/10 hover:bg-white/20'">
      
      @if (isLoadingCamera()) {
        <svg class="animate-spin h-7 w-7 text-white" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      } @else {
        <div class="relative z-10 transition-all duration-300 group-hover:scale-110" [class.rotate-90]="isShuttingDown()">
          @if (isCameraActive()) {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
          }
        </div>
      }
      
      <!-- Glow effect -->
      <div class="absolute inset-0 bg-gradient-to-tr from-white/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
    </button>

    <div class="flex flex-col items-center gap-1 opacity-40">
      <span class="text-[9px] text-white font-bold tracking-[0.3em] uppercase">{{ appVersion() }}</span>
      <div class="w-12 h-[1px] bg-gradient-to-r from-transparent via-white to-transparent"></div>
    </div>
  </div>
</div>
